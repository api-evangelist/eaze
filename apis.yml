name: Eaze
description: >-
  Eaze is a California-based cannabis marketplace and delivery platform that connects licensed
  dispensaries and cannabis brands with adult consumers, offering online ordering and same-day
  delivery of flower, edibles, vapes, and related products across the state. Founded in 2014 and
  headquartered in San Francisco, Eaze operates a consumer marketplace plus a technology and
  logistics stack for compliant retail. Backed by 500 Global and DCM Ventures, it was added to the
  API Evangelist network as a venture-portfolio lead. Eaze does not publish a public developer API,
  SDKs, or a developer portal; its api.eaze.com host is an internal, bot-protected surface.
